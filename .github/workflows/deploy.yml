name: Deploy

# Выкат в прод Vercel.
#  * автоматически — только когда CI прошёл на push в main, и ровно тот коммит,
#    который CI проверил (head_sha);
#  * вручную — Actions → Deploy → Run workflow с полем ref: так же делается откат
#    на предыдущий рабочий коммит.
#
# В поле ref принимается любая форма: имя ветки (main), тег (v1.2.3), короткий
# SHA (f3df650) и полный SHA. Раньше работал только полный: actions/checkout
# принимает короткий SHA не за коммит, а за образец имени ветки/тега, ищет
# refs/heads/f3df650* и падает с «exit code 1» — так упал прогон 34971736713
# (15.09.2026), а он же с полным SHA прошёл. Теперь checkout берёт ветку по
# умолчанию со всей историей, а коммит выбирает шаг «Resolve ref».
#
# Нужны: секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID.
# Без них workflow не падает, а пропускает выкат с предупреждением.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег, короткий или полный SHA для выката (для отката — коммит предыдущей рабочей версии)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Автовыкат только после успешного CI на push в main (не на PR и не на форк).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Выкат пропущен: нужен секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Без ref: и со всей историей — чтобы нужный коммит можно было выбрать
      # локально, в какой бы форме его ни назвали. Сам ref сюда не передаётся.
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Resolve ref
        if: steps.creds.outputs.ready == 'true'
        id: target
        env:
          # При автозапуске — ровно тот коммит, который проверил CI: между CI и
          # выкатом в main может лечь следующий коммит, и «то, что сейчас в main»
          # уехало бы непроверенным.
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          req="${REQUESTED_REF:-}"
          if [ -z "$req" ]; then
            echo "::error::Пустой ref: нечего выкатывать"
            exit 1
          fi
          # Порядок проб: коммит/тег/локальная ветка → ветка на origin → тег.
          resolve() {
            local cand
            for cand in "$1" "origin/$1" "refs/tags/$1"; do
              if git rev-parse --verify --quiet "${cand}^{commit}"; then
                return 0
              fi
            done
            return 1
          }
          if ! sha=$(resolve "$req"); then
            # Коммит вне веток и тегов (например, из уже закрытого PR) — добираем точечно.
            git fetch --quiet origin "$req" 2>/dev/null || true
            if ! sha=$(resolve "$req"); then
              echo "::error::Не нашёл такой коммит/ветку/тег: '$req'"
              exit 1
            fi
          fi
          git checkout --quiet --detach "$sha"
          short=$(git rev-parse --short "$sha")
          subject=$(git log -1 --pretty=%s "$sha")
          {
            echo "sha=$sha"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"
          echo "Выкат: $sha ($short) — $subject" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel production settings
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Отпечаток сборки: в HTML каждой локали уезжает SHA коммита выката.
      # Только по нему смока может ИЗМЕРИТЬ, что край отдаёт нашу сборку,
      # а не пережившую выкат копию предыдущей (см. src/lib/build.ts).
      # Значение кладётся и в окружение, и в файл, который читает `vercel build`:
      # что именно CLI пробрасывает в сборку фреймворка — его внутреннее дело,
      # а отпечаток обязан быть, иначе следующий шаг не пустит выкат дальше.
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ steps.target.outputs.sha }}
          VERCEL_ENV_FILE: .vercel/.env.production.local
        run: |
          set -euo pipefail
          printf 'NEXT_PUBLIC_BUILD_SHA="%s"\n' "$NEXT_PUBLIC_BUILD_SHA" >> "$VERCEL_ENV_FILE"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"

      # Ворота перед выкатом: отпечаток обязан лежать в предсобранной странице
      # КАЖДОЙ локали. Если переменная не доехала до сборки, смока после выката
      # прождала бы весь бюджет и покраснела на исправном коде — а так мы этого
      # просто не выкатываем и падаем за секунду, до всякого трафика.
      - name: Отпечаток сборки на месте
        if: steps.creds.outputs.ready == 'true'
        env:
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          tag='<meta name="x-build-sha" content="'"$BUILD_SHA"'"'
          missing=""; seen=0
          for loc in uk en he ro; do
            file=$(find .next .vercel/output -name "$loc.html" 2>/dev/null \
                   | xargs -r grep -lF "$tag" 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              seen=$((seen + 1))
              echo "  ✓ /$loc: отпечаток $BUILD_SHA в $file"
            else
              missing="$missing /$loc"
            fi
          done
          if [ -z "$missing" ]; then
            echo "Отпечаток $BUILD_SHA на месте во всех четырёх локалях"
            exit 0
          fi
          # Имена файлов в сборке — внутреннее дело Next и Vercel, и однажды они
          # поменяются. Ворота стоят не ради имён, а ради одной поломки: отпечатка
          # нет вовсе. Не нашли ни одной предсобранной страницы — ищем тег по всей
          # сборке и, если он там есть, выкат не держим, но говорим об этом вслух.
          hits=$(grep -rlF "$tag" .next .vercel/output 2>/dev/null | wc -l)
          if [ "$seen" -eq 0 ] && [ "$hits" -gt 0 ]; then
            echo "::warning::Предсобранных uk/en/he/ro.html не нашлось — раскладка сборки изменилась. Отпечаток $BUILD_SHA найден в $hits файл(ах), выкат продолжаем, а эту проверку пора поправить"
            exit 0
          fi
          echo "::error::В собранных страницах${missing} нет отпечатка $BUILD_SHA — смоке будет нечего проверять, выкат остановлен"
          exit 1

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Выкачено: $url (коммит ${{ steps.target.outputs.short }})" >> "$GITHUB_STEP_SUMMARY"

      # Смока проверяет БОЕВОЙ домен, а не адрес выката.
      #
      # `vercel deploy` печатает адрес самого выката вида
      # shur-shur-<хеш>-<команда>.vercel.app — он закрыт защитой Vercel и
      # отвечает 302 на vercel.com/sso-api. Прежний шаг падал только на 5xx,
      # поэтому такой 302 считался успехом: выкаты 34973713713, 34971977825 и
      # 34973869698 (15.09.2026) «прошли смоку», не прочитав ни строки нашей
      # страницы. Зелёный шаг, который ничего не проверяет, хуже отсутствующего.
      #
      # Сама проверка живёт в scripts/smoke-production.sh — рядом с
      # scripts/check-404.sh и по той же причине: тело шага в YAML нельзя
      # прогнать по подделке боевого сайта, а файл можно, и проверяется тогда
      # ровно тот код, который поедет в бой. Что именно он требует и почему
      # ждёт — в шапке скрипта.
      - name: Smoke check
        if: steps.creds.outputs.ready == 'true'
        env:
          # Сюда `vercel pull` (шаг выше) кладёт боевые переменные проекта.
          # Адрес берём отсюда, а не константой в сценарии: константу забудут
          # поменять при смене домена, и смока начнёт проверять чужой сайт.
          VERCEL_ENV_FILE: .vercel/.env.production.local
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          if [ ! -f "$VERCEL_ENV_FILE" ]; then
            echo "::error::Нет файла $VERCEL_ENV_FILE — vercel pull не отработал, боевой адрес неизвестен"
            exit 1
          fi
          # Значение приходит в кавычках: NEXT_PUBLIC_SITE_URL="https://example.com".
          base=$(sed -n 's/^NEXT_PUBLIC_SITE_URL=//p' "$VERCEL_ENV_FILE" \
                 | tail -n1 | tr -d '"'\''\r' | sed 's:/*$::')
          if [ -z "$base" ]; then
            echo "::error::В $VERCEL_ENV_FILE нет NEXT_PUBLIC_SITE_URL — проверять смоку не по чему"
            exit 1
          fi

          ./scripts/smoke-production.sh "$base" "$BUILD_SHA"
