name: Deploy

# Выкат в прод Vercel.
#  * автоматически — только когда CI прошёл на push в main, и ровно тот коммит,
#    который CI проверил (head_sha);
#  * вручную — Actions → Deploy → Run workflow с полем ref: так же делается откат
#    на предыдущий рабочий коммит.
#
# В поле ref принимается любая форма: имя ветки (main), тег (v1.2.3), короткий
# SHA (f3df650) и полный SHA. Раньше работал только полный: actions/checkout
# принимает короткий SHA не за коммит, а за образец имени ветки/тега, ищет
# refs/heads/f3df650* и падает с «exit code 1» — так упал прогон 34971736713
# (15.09.2026), а он же с полным SHA прошёл. Теперь checkout берёт ветку по
# умолчанию со всей историей, а коммит выбирает шаг «Resolve ref».
#
# Нужны: секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID.
# Без них workflow не падает, а пропускает выкат с предупреждением.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег, короткий или полный SHA для выката (для отката — коммит предыдущей рабочей версии)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Автовыкат только после успешного CI на push в main (не на PR и не на форк).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Выкат пропущен: нужен секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Без ref: и со всей историей — чтобы нужный коммит можно было выбрать
      # локально, в какой бы форме его ни назвали. Сам ref сюда не передаётся.
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Resolve ref
        if: steps.creds.outputs.ready == 'true'
        id: target
        env:
          # При автозапуске — ровно тот коммит, который проверил CI: между CI и
          # выкатом в main может лечь следующий коммит, и «то, что сейчас в main»
          # уехало бы непроверенным.
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          req="${REQUESTED_REF:-}"
          if [ -z "$req" ]; then
            echo "::error::Пустой ref: нечего выкатывать"
            exit 1
          fi
          # Порядок проб: коммит/тег/локальная ветка → ветка на origin → тег.
          resolve() {
            local cand
            for cand in "$1" "origin/$1" "refs/tags/$1"; do
              if git rev-parse --verify --quiet "${cand}^{commit}"; then
                return 0
              fi
            done
            return 1
          }
          if ! sha=$(resolve "$req"); then
            # Коммит вне веток и тегов (например, из уже закрытого PR) — добираем точечно.
            git fetch --quiet origin "$req" 2>/dev/null || true
            if ! sha=$(resolve "$req"); then
              echo "::error::Не нашёл такой коммит/ветку/тег: '$req'"
              exit 1
            fi
          fi
          git checkout --quiet --detach "$sha"
          short=$(git rev-parse --short "$sha")
          subject=$(git log -1 --pretty=%s "$sha")
          {
            echo "sha=$sha"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"
          echo "Выкат: $sha ($short) — $subject" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel production settings
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Выкачено: $url (коммит ${{ steps.target.outputs.short }})" >> "$GITHUB_STEP_SUMMARY"

      # Смока проверяет БОЕВОЙ домен, а не адрес выката.
      #
      # `vercel deploy` печатает адрес самого выката вида
      # shur-shur-<хеш>-<команда>.vercel.app — он закрыт защитой Vercel и
      # отвечает 302 на vercel.com/sso-api. Прежний шаг падал только на 5xx,
      # поэтому такой 302 считался успехом: выкаты 34973713713, 34971977825 и
      # 34973869698 (15.09.2026) «прошли смоку», не прочитав ни строки нашей
      # страницы. Зелёный шаг, который ничего не проверяет, хуже отсутствующего.
      #
      # Теперь проверяется то, что видит человек: боевой домен из настроек
      # Vercel, все четыре локали ровно по 200, апекс — 308 на /uk без петли,
      # и в теле каждой страницы — наш canonical. Любое отличие валит выкат.
      - name: Smoke check
        if: steps.creds.outputs.ready == 'true'
        env:
          # Сюда `vercel pull` (шаг выше) кладёт боевые переменные проекта.
          # Адрес берём отсюда, а не константой в сценарии: константу забудут
          # поменять при смене домена, и смока начнёт проверять чужой сайт.
          VERCEL_ENV_FILE: .vercel/.env.production.local
          # Признак свежести. После выката Vercel сбрасывает кеш CDN, и age
          # начинает считаться заново, поэтому у только что выкаченной страницы
          # он единицы секунд. Большой age — ответ, переживший выкат: показывают
          # старое. Порог с запасом на прогрев и на повторные попытки curl.
          MAX_AGE_SECONDS: "120"
        run: |
          set -euo pipefail

          if [ ! -f "$VERCEL_ENV_FILE" ]; then
            echo "::error::Нет файла $VERCEL_ENV_FILE — vercel pull не отработал, боевой адрес неизвестен"
            exit 1
          fi
          # Значение приходит в кавычках: NEXT_PUBLIC_SITE_URL="https://example.com".
          base=$(sed -n 's/^NEXT_PUBLIC_SITE_URL=//p' "$VERCEL_ENV_FILE" \
                 | tail -n1 | tr -d '"'\''\r' | sed 's:/*$::')
          if [ -z "$base" ]; then
            echo "::error::В $VERCEL_ENV_FILE нет NEXT_PUBLIC_SITE_URL — проверять смоку не по чему"
            exit 1
          fi
          echo "Боевой адрес: $base"

          fail=0
          note() { echo "  ✗ $*"; fail=1; }
          # `|| true` обязателен: при set -o pipefail отсутствующий заголовок
          # делает grep неуспешным, а set -e убивает шаг молча — без единой
          # строки о причине. Ровно это и ловили на прогоне против чужого адреса.
          hdr() { grep -i "^$2:" "$1" | tail -n1 | sed 's/^[^:]*:[ \t]*//' | tr -d '\r' || true; }

          # 1. Четыре локали: ровно 200, наша страница, свежий ответ.
          for loc in uk en he ro; do
            url="$base/$loc"
            head=$(mktemp); body=$(mktemp)
            code=$(curl -sS -o "$body" -D "$head" -w '%{http_code}' \
                   --max-time 30 --retry 2 --retry-delay 5 "$url" || true)
            code=${code:-000}
            age=$(hdr "$head" age); cache=$(hdr "$head" x-vercel-cache); vid=$(hdr "$head" x-vercel-id)
            echo "GET $url -> $code (x-vercel-cache: ${cache:-—}, age: ${age:-0}, x-vercel-id: ${vid:-—})"

            [ "$code" = "200" ] || note "$url: ждали 200, получили $code"

            # Маркер нашей страницы: canonical с нашим доменом И этой локалью.
            # Ни заглушка хостинга, ни страница ошибки Vercel такого не отдадут.
            marker="rel=\"canonical\" href=\"$base/$loc\""
            grep -qF "$marker" "$body" \
              || note "$url: в теле нет маркера [$marker] — это не наша страница"

            case "${age:-0}" in ''|*[!0-9]*) age=0 ;; esac
            [ "${age:-0}" -le "$MAX_AGE_SECONDS" ] \
              || note "$url: age=${age}s — ответ пережил выкат (порог ${MAX_AGE_SECONDS}s), показывают не свежее"
          done

          # 2. Апекс: 308 на /uk и не больше двух переходов до 200.
          #    Петля редиректов на домене — самая дорогая поломка: сайта нет,
          #    а все четыре локали по отдельности при этом живые.
          apex_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/" || true)
          apex_to=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 "$base/" || true)
          echo "GET $base/ -> ${apex_code:-000} -> ${apex_to:-—}"
          [ "${apex_code:-000}" = "308" ] || note "$base/: ждали 308, получили ${apex_code:-000}"
          [ "$apex_to" = "$base/uk" ] || note "$base/: ждали переход на $base/uk, получили '${apex_to:-—}'"

          chain=$(curl -sS -L -o /dev/null --max-redirs 5 \
                  -w '%{num_redirects} %{http_code} %{url_effective}' --max-time 30 "$base/" || true)
          set -- ${chain:-9 000 —}
          echo "Цепочка апекса: переходов=$1, итог=$2 ($3)"
          [ "$1" -le 2 ] || note "$base/: $1 переходов до конца — похоже на петлю редиректов"
          [ "$2" = "200" ] || note "$base/: цепочка закончилась кодом $2, а не 200"
          [ "$3" = "$base/uk" ] || note "$base/: цепочка привела на '$3', а не на $base/uk"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Смока не прошла: боевой сайт отдаёт не то, что мы выкатили (подробности выше)"
            exit 1
          fi
          echo "Смока прошла: $base — 4 локали по 200 с нашим canonical, апекс 308 на /uk"
