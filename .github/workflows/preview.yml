name: Preview

# Превью-выкат в Vercel: отдельный адрес, чтобы показать неслитую ветку живьём.
# Связи Vercel с GitHub у проекта нет, автопревью на push никто не собирает, —
# значит собрать превью может только сам Actions, и только по решению человека:
# поэтому единственный запуск — ручной, без автотриггеров на push и pull_request.
# Сценарий намеренно не трогает прод: сборка и выкат идут без ключа продакшена,
# очередь concurrency своя, environment у работы нет — окружение production
# в репозитории одно, и превью к нему отношения не имеет.
# Нужны: секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID.
# Без них workflow не падает, а пропускает выкат с предупреждением — как в deploy.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или коммит, который нужно показать"
        required: true
        default: redesign/v3-show-more-tell-less

permissions:
  contents: read

# Своя очередь, отдельная от deploy-production: превью не должно ни ждать
# прод-выката, ни тем более отменять его. Ключ — по показываемой ветке,
# чтобы превью разных веток собирались параллельно.
concurrency:
  group: deploy-preview-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Превью пропущено: нужен секрет VERCEL_TOKEN и переменные VERCEL_ORG_ID / VERCEL_PROJECT_ID"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel preview settings
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Сводка прогона — единственное место, откуда дирижёр возьмёт ссылку.
          echo "Превью: $url (коммит $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        if: steps.creds.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/uk")
          echo "GET /uk -> $code"
          # 401/403 — это защита превью Vercel, не поломка; падаем только на 5xx и отсутствии ответа.
          case "$code" in 5*|000) exit 1 ;; esac
