name: Vercel logs

# Ошибки функций Vercel за последние полчаса → упавший запуск. Логи функций на Hobby
# живут меньше часа (окно 65 мин API отклоняет: «hobby plan does not retain»,
# 23.10.2026) и дренажей нет, поэтому каждые 30 мин читаем окно 33 мин CLI (`vercel logs`,
# runtime, production) и падаем, если есть level error/fatal. Упавший запуск
# ловит сторож журнала на сервере (ops/logwatch) и пишет дирижёру shur.
#
# Репозиторий ПУБЛИЧНЫЙ: в вывод идут только счётчики по уровню и пути (без
# query-строки) — ни текста сообщений, ни заголовков, ни тел запросов.
# Отключить: Actions → Vercel logs → Disable workflow.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: окно
        default: 33m
      diag:
        description: temporary groshi diag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vercel-logs
  cancel-in-progress: false

jobs:
  errors:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - if: ${{ inputs.diag }}
        uses: actions/checkout@v4
      - if: ${{ inputs.diag }}
        name: Groshi diag (temporary, read-only, counts only)
        run: |
          mkdir -p "$RUNNER_TEMP/d" && cp ops/groshi-diag.mjs "$RUNNER_TEMP/d/" && cd "$RUNNER_TEMP/d"
          npm init -y >/dev/null && npm i --silent @vercel/blob@2.8.2 >/dev/null
          npx --yes vercel@65.2.0 link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || echo "link failed"
          npx --yes vercel@65.2.0 env pull .env.prod --environment production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null 2>&1 || echo "env pull failed"
          BLOB_READ_WRITE_TOKEN="$(grep '^BLOB_READ_WRITE_TOKEN=' .env.prod | cut -d= -f2- | tr -d '"')"
          export BLOB_READ_WRITE_TOKEN
          rm -f .env.prod
          test -n "$BLOB_READ_WRITE_TOKEN" || echo "no blob token"
          node groshi-diag.mjs
      # `vercel logs` с --json/--since/--environment — CLI 65; версия закреплена.
      - name: Ошибки функций за 33 мин
        run: |
          npx --yes vercel@65.2.0 logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" --environment production --since ${{ inputs.since || '33m' }} --limit 10000 --json \
            > logs.jsonl 2> logs.err || { echo "::error::vercel logs не отработал (код $?)"; tail -c 600 logs.err | sed -E 's/[A-Za-z0-9_-]{24,}/<…>/g'; exit 1; }
          node - <<'EOF'
          const fs = require("node:fs");
          const counts = new Map();
          let records = 0;
          let shape = "";
          let lines = 0;
          let returned = 0;
          const top = new Set();
          for (const line of fs.readFileSync("logs.jsonl", "utf8").split("\n")) {
            if (!line.trim()) continue;
            let r;
            try { r = JSON.parse(line); } catch { continue; }
            lines++;
            if (r.type === "summary") { returned = Number(r.recordsReturned ?? 0); continue; }
            // Only key NAMES (and the line type) — never values: the repo is public.
            Object.keys(r).forEach((k) => top.add(k + (k === "type" ? "=" + String(r.type).slice(0, 20) : "")));
            // CLI 65 writes {"type":"log","data":{level,requestPath,message,…}} (recordLine in
            // its source); other line types (summary, warning) carry no level and are skipped.
            const rec = (r.data && typeof r.data === "object" ? r.data : null) ?? r.record ?? r.log ?? r;
            const level = String(rec.level ?? "").toLowerCase();
            if (!level) continue;
            records++;
            if (!shape) shape = Object.keys(rec).sort().join(",");
            if (level !== "error" && level !== "fatal") continue;
            const path = String(rec.requestPath ?? rec.path ?? "?").split("?")[0].slice(0, 80);
            // Only the action type and error class of «Гроші» failures — no sums, no names.
            const gm = /\[groshi\] ([a-z.]{1,20}) failed: ([A-Za-z]{1,40})/.exec(String(rec.message ?? ""));
            if (gm) { const g = `groshi ${gm[1]} ${gm[2]}`; counts.set(g, (counts.get(g) ?? 0) + 1); }
            const key = `${level} ${path}`;
            counts.set(key, (counts.get(key) ?? 0) + 1);
          }
          console.log(`строк JSON: ${lines} (ключи: ${[...top].sort().join(",") || "—"}); записей с уровнем за 33 мин: ${records}; поля записи: ${shape || "—"}`);
          for (const [k, n] of counts) console.log(`  ${k} ×${n}`);
          // Blind is worse than loud: records came back but none parsed → the CLI format changed.
          if (returned > 0 && records === 0) {
            console.log(`::error::Vercel вернул ${returned} записей, разбор не нашёл ни одной с уровнем — формат CLI изменился`);
            process.exit(1);
          }
          if (counts.size) {
            console.log("::error::ошибки функций Vercel за 33 мин — подробности: vercel logs --environment production --since 30m --query level:error");
            process.exit(1);
          }
          EOF
