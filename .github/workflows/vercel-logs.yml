name: Vercel logs

# Ошибки функций Vercel за последний час → упавший запуск. Логи функций на Hobby
# живут ~1 ч и дренажей нет, поэтому раз в час читаем их CLI (`vercel logs`,
# runtime, production) и падаем, если есть level error/fatal. Упавший запуск
# ловит сторож журнала на сервере (ops/logwatch) и пишет дирижёру shur.
#
# Репозиторий ПУБЛИЧНЫЙ: в вывод идут только счётчики по уровню и пути (без
# query-строки) — ни текста сообщений, ни заголовков, ни тел запросов.
# Отключить: Actions → Vercel logs → Disable workflow.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-logs
  cancel-in-progress: false

jobs:
  errors:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # `vercel logs` с --json/--since/--environment — CLI 65; версия закреплена.
      - name: Ошибки функций за час
        run: |
          npx --yes vercel@65.2.0 logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" --environment production --since 65m --limit 10000 --json \
            > logs.jsonl 2> logs.err || { echo "::error::vercel logs не отработал (код $?)"; tail -c 600 logs.err | sed -E 's/[A-Za-z0-9_-]{24,}/<…>/g'; exit 1; }
          node - <<'EOF'
          const fs = require("node:fs");
          const counts = new Map();
          let records = 0;
          let shape = "";
          for (const line of fs.readFileSync("logs.jsonl", "utf8").split("\n")) {
            if (!line.trim()) continue;
            let r;
            try { r = JSON.parse(line); } catch { continue; }
            const rec = r.record ?? r.log ?? r;
            const level = String(rec.level ?? "").toLowerCase();
            if (!level) continue;
            records++;
            if (!shape) shape = Object.keys(rec).sort().join(",");
            if (level !== "error" && level !== "fatal") continue;
            const path = String(rec.requestPath ?? rec.path ?? "?").split("?")[0].slice(0, 80);
            const key = `${level} ${path}`;
            counts.set(key, (counts.get(key) ?? 0) + 1);
          }
          console.log(`записей за час: ${records}; поля записи: ${shape || "—"}`);
          for (const [k, n] of counts) console.log(`  ${k} ×${n}`);
          if (counts.size) {
            console.log("::error::ошибки функций Vercel за час — подробности: vercel logs --environment production --since 1h --query level:error");
            process.exit(1);
          }
          EOF
